<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog/News - zipRock official site</title>

    <style>
        /* ==============
         * 基本設定 & リセット
         * ============== */
        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background-color: #0c0c0c;
            color: #ffffff;
            font-family: "游ゴシック体", YuGothic, "游ゴシック", "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            font-size: 16px; /* PCでの基本フォントサイズ */
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: opacity 0.3s;
        }
        a:hover {
            opacity: 0.8;
        }

        img {
            max-width: 100%;
            vertical-align: top;
        }

        /* ==============
         * ヘッダー
         * ============== */
        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 10px 40px;
            color: #707070;
        }

        .site-header .header-logo img {
            width: 280px;
        }

        .site-header .header-menu {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .site-header .header-menu a {
            display: block;
            padding: 10px 15px;
            color: #707070;
            font-size: 1rem;
            font-weight: 500;
        }
        /* 現在のページを示す.activeクラス */
        .site-header .header-menu a.active {
            border-bottom: 2px solid #707070;
        }

        /* ==============
         * メインコンテンツ (ニュースリスト)
         * ============== */
        main {
            padding: 60px 20px;
        }
        
        .page-title {
            font-size: 2.2rem;
            text-align: center;
            margin-bottom: 40px;
        }

        .news-list {
            max-width: 800px;
            margin: 0 auto;
            list-style: none;
            padding: 0;
        }

        .news-list-item {
            border-bottom: 1px solid #444;
        }
        .news-list-item:first-child {
            border-top: 1px solid #444;
        }

        .news-list-item a {
            position: relative;
            display: flex;
            align-items: center;
            padding: 20px 40px 20px 10px; /* 右側に矢印用のスペース */
            color: #ffffff;
        }

        .news-list-date {
            display: flex;
            align-items: center;
            margin-right: 20px;
            flex-shrink: 0; /* 日付が改行されないように */
        }
        
        .news-category {
            background: #555;
            color: #fff;
            border-radius: 4px;
            padding: 4px 12px;
            font-size: 0.8rem;
            margin-left: 15px;
        }
        
        .news-title {
            margin: 0;
            font-size: 1rem;
            line-height: 1.6;
        }

        .news-arrow {
            width: 8px;
            height: 8px;
            border-top: 2px solid #888;
            border-right: 2px solid #888;
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%) rotate(45deg);
        }

        /* ==============
         * トップへ戻るボタン
         * ============== */
        .pagetop {
            width: 60px;
            height: 60px;
            position: fixed;
            bottom: 25px;
            right: 25px;
            opacity: 0; /* 最初は非表示 */
            visibility: hidden;
            transition: all .3s;
        }

        /* JavaScriptによってこのクラスが付与されると表示される */
        .pagetop.is-active {
            opacity: 1;
            visibility: visible;
        }

        .pagetop a {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            color: #333;
        }
        .pagetop a::before {
            content: "▲";
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* ==============
         * レスポンシブ対応 (画面幅が768px以下の場合)
         * ============== */
        @media screen and (max-width: 768px) {
            body {
                font-size: 15px;
            }
            /* --- ヘッダー --- */
            .site-header {
                flex-direction: column; /* 縦並びに */
                padding: 15px;
            }
            .site-header .header-logo {
                margin-bottom: 15px;
            }
            .site-header .header-logo img {
                width: 220px;
            }
            .site-header .header-menu {
                flex-wrap: wrap;
                justify-content: center;
            }
            .site-header .header-menu a {
                font-size: 0.9rem;
                padding: 8px 10px;
            }

            /* --- コンテンツ --- */
            main {
                padding: 40px 15px;
            }
            .page-title {
                font-size: 1.8rem;
            }
            .news-list-item a {
                flex-direction: column; /* 縦並びにする */
                align-items: flex-start;
            }
            .news-list-date {
                margin-bottom: 10px;
            }
            .news-title {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
