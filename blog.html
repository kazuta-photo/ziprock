<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog/News - zipRock official site</title>

    <style>
        /* ==============
         * 基本設定 & サイト共通のスタイル
         * ============== */
        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background-color: #0c0c0c;
            color: #ffffff;
            font-family: "游ゴシック体", YuGothic, "游ゴシック", "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            font-size: 16px;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: opacity 0.3s;
        }
        a:hover {
            opacity: 0.7;
        }

        img {
            max-width: 100%;
            vertical-align: top;
        }

        /* ==============
         * ヘッダー (全ページ共通)
         * ============== */
        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 10px 40px;
            color: #707070;
        }

        .site-header .header-logo img {
            width: 280px;
        }

        .site-header .header-menu {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .site-header .header-menu a {
            display: block;
            padding: 10px 15px;
            color: #707070;
            font-size: 1rem;
            font-weight: 500;
        }
        /* 現在表示しているページを分かりやすくするデザイン */
        .site-header .header-menu a.active {
            border-bottom: 2px solid #707070;
        }

        /* ==============
         * メインコンテンツ (このページ専用のスタイル)
         * ============== */
        main {
            padding: 60px 20px;
        }
        
        .page-title {
            font-size: 2.2rem;
            text-align: center;
            margin-top: 0;
            margin-bottom: 40px;
        }

        .news-list {
            max-width: 800px;
            margin: 0 auto;
            list-style: none;
            padding: 0;
        }

        .news-list-item {
            border-bottom: 1px solid #444;
        }
        .news-list-item:first-child {
            border-top: 1px solid #444;
        }

        .news-list-item a {
            position: relative;
            display: flex;
            align-items: center;
            padding: 20px 40px 20px 10px; /* 右側に矢印用のスペース */
        }

        .news-list-date {
            display: flex;
            align-items: center;
            margin-right: 20px;
            flex-shrink: 0; /* 日付が改行されないように */
        }
        
        .news-category {
            background: #555;
            color: #fff;
            border-radius: 4px;
            padding: 4px 12px;
            font-size: 0.8rem;
            margin-left: 15px;
        }
        
        .news-title {
            margin: 0;
            font-size: 1rem;
            line-height: 1.6;
        }

        .news-arrow {
            width: 8px;
            height: 8px;
            border-top: 2px solid #888;
            border-right: 2px solid #888;
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%) rotate(45deg);
        }

        /* ==============
         * トップへ戻るボタン (全ページ共通)
         * ============== */
        .pagetop {
            width: 60px;
            height: 60px;
            position: fixed;
            bottom: 25px;
            right: 25px;
            opacity: 0; /* 最初は非表示 */
            visibility: hidden;
            transition: all .3s;
        }

        /* JavaScriptによってこのクラスが付与されると表示される */
        .pagetop.is-active {
            opacity: 1;
            visibility: visible;
        }

        .pagetop a {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
        }
        .pagetop a::before {
            content: "▲";
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
        }

        /* ==============
         * レスポンシブ対応 (全ページ共通)
         * ============== */
        @media screen and (max-width: 768px) {
            body {
                font-size: 15px;
            }
            /* --- ヘッダー --- */
            .site-header {
                flex-direction: column; /* 縦並びに */
                padding: 15px;
            }
            .site-header .header-logo {
                margin-bottom: 15px;
            }
            .site-header .header-logo img {
                width: 220px;
            }
            .site-header .header-menu {
                flex-wrap: wrap;
                justify-content: center;
            }
            .site-header .header-menu a {
                font-size: 0.9rem;
                padding: 8px 10px;
            }

            /* --- コンテンツ --- */
            main {
                padding: 40px 15px;
            }
            .page-title {
                font-size: 1.8rem;
            }
            .news-list-item a {
                flex-direction: column; /* 縦並びにする */
                align-items: flex-start;
            }
            .news-list-date {
                margin-bottom: 10px;
            }
            .news-title {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="header-logo">
            <a href="index.html"><img src="1745239922408~2.jpg" alt="zipRock Logo"></a>
        </div>
        <nav>
            <ul class="header-menu">
                <li><a href="index.html">TOP</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="blog.html" class="active">Blog/News</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1 class="page-title">Blog/News</h1>
        <ul class="news-list">
            <li class="news-list-item">
                <a href="blogno4.html">
                    <div class="news-list-date">
                        <time>2025.05.18</time>
                        <span class="news-category">blog</span>
                    </div>
                    <p class="news-title">エレキギター弦高調整</p>
                    <span class="news-arrow"></span>
                </a>
            </li>
            <li class="news-list-item">
                <a href="blogno3.html">
                    <div class="news-list-date">
                        <time>2025.05.05</time>
                        <span class="news-category">news</span>
                    </div>
                    <p class="news-title">2025文化祭ライブに参加表明、しかし...!?</p>
                    <span class="news-arrow"></span>
                </a>
            </li>
            <li class="news-list-item">
                <a href="blogno2.html">
                    <div class="news-list-date">
                        <time>2025.05.05</time>
                        <span class="news-category">blog</span>
                    </div>
                    <p class="news-title">練習中の曲について</p>
                    <span class="news-arrow"></span>
                </a>
            </li>
            <li class="news-list-item">
                <a href="blogno1.html">
                    <div class="news-list-date">
                        <time>2025.05.05</time>
                        <span class="news-category">news</span>
                    </div>
                    <p class="news-title">zipRock公式サイト開設</p>
                    <span class="news-arrow"></span>
                </a>
            </li>
        </ul>
    </main>

    <div class="pagetop">
        <a href="#"></a>
    </div>

    <script>
        'use strict';
        // 「TOPへ戻る」ボタンのスクリプト
        const pageTopBtn = document.querySelector('.pagetop');
        window.addEventListener('scroll', () => {
            // 300px以上スクロールしたらボタンを表示する
            if (window.scrollY > 300) {
                pageTopBtn.classList.add('is-active');
            } else {
                pageTopBtn.classList.remove('is-active');
            }
        });
    </script>

</body>
</html>
