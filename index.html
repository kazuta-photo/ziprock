<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zipRock official site</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js" defer></script>

    <style>
        /* ==============
         * 基本設定 & リセット
         * ============== */
        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background-color: #0c0c0c;
            color: #ffffff;
            font-family: "游ゴシック体", YuGothic, "游ゴシック", "Yu Gothic", sans-serif;
            text-align: center;
            line-height: 1.8;
        }

        a {
            text-decoration: none;
            color: inherit; /* 基本的に親要素の色を継承 */
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        img {
            max-width: 100%;
            height: auto;
            vertical-align: middle;
        }

        /* ==============
         * ヘッダー
         * ============== */
        .header1 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 10px 40px;
            color: #707070;
        }

        .header1 .header-logo img {
            width: 280px;
        }

        .header1 .header-menu {
            display: flex;
            font-size: 1rem;
        }

        .header1 .header-menu a {
            padding: 10px 15px;
            transition: border-bottom 0.3s;
        }

        .header1 .header-menu a:hover,
        .header1 .header-menu a.active {
            border-bottom: 2px solid #707070;
        }

        /* ==============
         * メインコンテンツ
         * ============== */
        .main-visual img {
            width: 100%;
            height: 600px;
            object-fit: cover;
        }

        .content-section {
            padding: 60px 20px;
        }

        .heading {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .heading::before,
        .heading::after {
            content: '';
            width: 70px;
            height: 3px;
            background-color: #ffffff;
        }

        .heading::before {
            margin-right: 20px;
        }

        .heading::after {
            margin-left: 20px;
        }
        
        .content-section p {
            font-size: 1rem;
            line-height: 2; /* line-heightは単位なしが推奨 */
        }

        /* ==============
         * ニュースセクション
         * ============== */
        .news_list {
            max-width: 800px;
            margin: 0 auto;
            text-align: left;
        }

        .news_list_item {
            border-bottom: 1px solid #444;
        }
        .news_list_item:first-child {
            border-top: 1px solid #444;
        }

        .news_list_item a {
            position: relative;
            display: flex;
            align-items: center;
            padding: 20px 30px 20px 10px;
            color: #ffffff;
            transition: background-color 0.3s;
        }
        .news_list_item a:hover {
            background-color: #222;
        }

        .news_list_date {
            display: flex;
            align-items: center;
            margin-right: 20px;
            font-size: 1rem;
        }

        .news_item_category {
            background: #555;
            color: #fff;
            border-radius: 4px;
            padding: 4px 12px;
            font-size: 0.8rem;
            margin-left: 15px;
            flex-shrink: 0; /* 縮まないように設定 */
        }

        .news_item_title {
            margin: 0;
            font-size: 1rem;
        }

        .arrow {
            width: 25px;
            height: 1px;
            background: #b4b4b4;
            position: absolute;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
        }

        .arrow::after {
            content: "";
            display: block;
            width: 8px;
            height: 8px;
            border-top: 1px solid #b4b4b4;
            border-right: 1px solid #b4b4b4;
            transform: rotate(45deg);
            position: absolute;
            right: 0px;
            top: -4px;
        }

        /* ==============
         * トップへ戻るボタン
         * ============== */
        .pagetop {
            width: 60px;
            height: 60px;
            position: fixed;
            bottom: 20px;
            right: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all .3s;
        }

        .pagetop.fadeIn {
            opacity: 1;
            visibility: visible;
        }

        .pagetop__link {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            color: #333;
            font-weight: bold;
        }

        .pagetop__text::before {
            content: "▲";
            font-size: 1.2rem;
        }
        
        /* ★★★ 追加・修正部分 ★★★ */
        /* ==============
         * フッター
         * ============== */
        .site-footer {
            padding: 40px 20px;
            border-top: 1px solid #2a2a2a; /* コンテンツとの区切り線 */
            margin-top: 40px; /* mainコンテンツとの余白 */
        }
        .copyright {
            color: #888; /* 少し薄い色で控えめに */
            font-size: 0.9rem;
            margin: 0;
        }
        /* ★★★ 追加・修正部分ここまで ★★★ */


        /* ==============
         * レスポンシブ対応 (画面幅が768px以下の場合)
         * ============== */
        @media screen and (max-width: 768px) {
            /* --- ヘッダー --- */
            .header1 {
                flex-direction: column; /* 縦並びに */
                padding: 15px;
            }

            .header1 .header-logo {
                margin-bottom: 15px;
            }

            .header1 .header-logo img {
                width: 220px;
            }

            .header1 .header-menu {
                font-size: 0.9rem;
                flex-wrap: wrap;
                justify-content: center;
            }
            .header1 .header-menu a {
                padding: 8px 10px;
            }
            
            /* --- メインビジュアル --- */
            .main-visual img {
                height: 350px; /* スマホでは高さを抑える */
            }
            
            /* --- 見出し --- */
            .heading {
                font-size: 1.8rem;
            }

            .heading::before,
            .heading::after {
                width: 40px; /* 線の長さを短く */
                height: 2px;
            }

            /* --- ニュース --- */
            .news_list_item a {
                flex-direction: column; /* 縦並びに */
                align-items: flex-start;
                padding-right: 10px;
            }
            
            .news_list_date {
                margin-bottom: 8px;
            }
