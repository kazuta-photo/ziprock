<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zipRock official site</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js" defer></script>

    <style>
        /* ==============
         * 基本設定 & リセット
         * ============== */
        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background-color: #0c0c0c;
            color: #ffffff;
            font-family: "游ゴシック体", YuGothic, "游ゴシック", "Yu Gothic", sans-serif;
            text-align: center;
            line-height: 1.8;
        }

        a {
            text-decoration: none;
            color: inherit; /* 基本的に親要素の色を継承 */
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        img {
            max-width: 100%;
            height: auto;
            vertical-align: middle;
        }

        /* ==============
         * ヘッダー
         * ============== */
        .header1 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 10px 40px;
            color: #707070;
        }

        .header1 .header-logo img {
            width: 280px;
        }

        .header1 .header-menu {
            display: flex;
            font-size: 1rem;
        }

        .header1 .header-menu a {
            padding: 10px 15px;
            transition: border-bottom 0.3s;
        }

        .header1 .header-menu a:hover,
        .header1 .header-menu a.active {
            border-bottom: 2px solid #707070;
        }

        /* ==============
         * メインコンテンツ
         * ============== */
        .main-visual img {
            width: 100%;
            height: 600px;
            object-fit: cover;
        }

        .content-section {
            padding: 60px 20px;
        }

        .heading {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .heading::before,
        .heading::after {
            content: '';
            width: 70px;
            height: 3px;
            background-color: #ffffff;
        }

        .heading::before {
            margin-right: 20px;
        }

        .heading::after {
            margin-left: 20px;
        }
        
        .content-section p {
            font-size: 1rem;
            line-height: 2; /* line-heightは単位なしが推奨 */
        }

        /* ==============
         * ニュースセクション
         * ============== */
        .news_list {
            max-width: 800px;
            margin: 0 auto;
            text-align: left;
        }

        .news_list_item {
            border-bottom: 1px solid #444;
        }
        .news_list_item:first-child {
            border-top: 1px solid #444;
        }

        .news_list_item a {
            position: relative;
            display: flex;
            align-items: center;
            padding: 20px 30px 20px 10px;
            color: #ffffff;
            transition: background-color 0.3s;
        }
        .news_list_item a:hover {
            background-color: #222;
        }

        .news_list_date {
            display: flex;
            align-items: center;
            margin-right: 20px;
            font-size: 1rem;
        }

        .news_item_category {
            background: #555;
            color: #fff;
            border-radius: 4px;
            padding: 4px 12px;
            font-size: 0.8rem;
            margin-left: 15px;
            flex-shrink: 0; /* 縮まないように設定 */
        }

        .news_item_title {
            margin: 0;
            font-size: 1rem;
        }

        .arrow {
            width: 25px;
            height: 1px;
            background: #b4b4b4;
            position: absolute;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
        }

        .arrow::after {
            content: "";
            display: block;
            width: 8px;
            height: 8px;
            border-top: 1px solid #b4b4b4;
            border-right: 1px solid #b4b4b4;
            transform: rotate(45deg);
            position: absolute;
            right: 0px;
            top: -4px;
        }

        /* ==============
         * トップへ戻るボタン
         * ============== */
        .pagetop {
            width: 60px;
            height: 60px;
            position: fixed;
            bottom: 20px;
            right: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all .3s;
        }

        .pagetop.fadeIn {
            opacity: 1;
            visibility: visible;
        }

        .pagetop__link {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            color: #333;
            font-weight: bold;
        }

        .pagetop__text::before {
            content: "▲";
            font-size: 1.2rem;
        }

        /* ==============
         * レスポンシブ対応 (画面幅が768px以下の場合)
         * ============== */
        @media screen and (max-width: 768px) {
            /* --- ヘッダー --- */
            .header1 {
                flex-direction: column; /* 縦並びに */
                padding: 15px;
            }

            .header1 .header-logo {
                margin-bottom: 15px;
            }

            .header1 .header-logo img {
                width: 220px;
            }

            .header1 .header-menu {
                font-size: 0.9rem;
                flex-wrap: wrap;
                justify-content: center;
            }
            .header1 .header-menu a {
                padding: 8px 10px;
            }
            
            /* --- メインビジュアル --- */
            .main-visual img {
                height: 350px; /* スマホでは高さを抑える */
            }
            
            /* --- 見出し --- */
            .heading {
                font-size: 1.8rem;
            }

            .heading::before,
            .heading::after {
                width: 40px; /* 線の長さを短く */
                height: 2px;
            }

            /* --- ニュース --- */
            .news_list_item a {
                flex-direction: column; /* 縦並びに */
                align-items: flex-start;
                padding-right: 10px;
            }
            
            .news_list_date {
                margin-bottom: 8px;
            }
            
            .news_item_category {
                margin-left: 0;
            }

            .news_item_title {
                margin-top: 8px;
            }

            .arrow {
                right: 10px;
            }
        }
    </style>
</head>
<body>

    <header class="header1">
        <div class="header-logo">
            <a href="#"><img src="1745239922408~2.jpg" alt="zipRock Logo"></a>
        </div>
        <nav class="header-menu">
            <a href="#" class="active">TOP</a>
            <a href="about.html">About</a>
            <a href="blog.html">Blog/News</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <div class="main-visual">
            <img src="IMG_20251023_015434.jpg" alt="バンドのメインイメージ">
        </div>

        <section class="content-section">
            <h2 class="heading">zipRockとは</h2>
            <p>
                高1男子による6人組のバンド。2024年11月頃に結成。<br>
                2025年の文化祭での発表を目指している。<br>
                主に定番の邦ロックを演奏する予定。<br>
                詳しくはページ先頭のaboutをクリック
            </p>
        </section>

        <section class="content-section">
            <h2 class="heading">NEWS</h2>
            <ul class="news_list">
                 <li class="news_list_item">
                    <a href="blogno4.html">
                        <div class="news_list_date">
                            <time>2025.05.18</time>
                            <span class="news_item_category">blog</span>
                        </div>
                        <p class="news_item_title">エレキギター弦高調整</p>
                        <span class="arrow"></span>
                    </a>
                </li>
                <li class="news_list_item">
                    <a href="blogno3.html">
                        <div class="news_list_date">
                            <time>2025.05.05</time>
                            <span class="news_item_category">news</span>
                        </div>
                        <p class="news_item_title">2025文化祭ライブに参加表明、しかし...!?</p>
                        <span class="arrow"></span>
                    </a>
                </li>
                <li class="news_list_item">
                    <a href="blogno2.html">
                        <div class="news_list_date">
                            <time>2025.05.05</time>
                            <span class="news_item_category">blog</span>
                        </div>
                        <p class="news_item_title">練習中の曲について</p>
                        <span class="arrow"></span>
                    </a>
                </li>
            </ul>
        </section>
    </main>

    <div class="pagetop">
        <a href="#" class="pagetop__link">
            <span class="pagetop__text"></span>
        </a>
    </div>

    <script>
        'use strict';
        const pageTop = document.querySelector('.pagetop');
        window.addEventListener('scroll', () => {
            if (window.pageYOffset > 400) { // 400pxスクロールしたら表示
                pageTop.classList.add('fadeIn');
            } else {
                pageTop.classList.remove('fadeIn');
            }
        });
    </script>

</body>
</html>
